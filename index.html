<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050005">
    <title>Spooooky Solitaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" href="./pumpkin/sprite_0.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="bg" class="bg" aria-hidden="true"></canvas>
    <div id="eyes" class="eyes" aria-hidden="true"><span></span><span></span></div>

    <div id="stage" class="stage">
      <!-- Menu -->
      <section id="menu-screen" class="menu" aria-label="Main menu">
        <div class="title-wrap">
          <h1 class="title" data-text="Spooooky">Spooooky</h1>
          <h1 class="title title--sub" data-text="Solitaire">Solitaire</h1>
        </div>
        <img class="menu-pumpkin" id="menu-pumpkin" src="./pumpkin/sprite_0.png" alt="" aria-hidden="true">
        <div class="game-picker" id="game-picker" role="radiogroup" aria-label="Game"></div>
        <p id="game-blurb" class="game-blurb"></p>
        <div class="menu-buttons">
          <button id="continue-button" class="btn btn--big btn--ecto" type="button" hidden>Continue</button>
          <button id="play-button" class="btn btn--big btn--blood" type="button">New game</button>
          <button id="daily-button" class="btn btn--big btn--pumpkin" type="button">Daily haunt</button>
          <button id="friends-button" class="btn btn--big btn--ecto" type="button" hidden>Play with friends</button>
          <div class="menu-options">
            <span id="variant-toggles" class="variant-toggles"></span>
            <button id="sound-toggle" class="btn btn--small" type="button" aria-pressed="true">Sound: on</button>
            <button id="music-toggle" class="btn btn--small" type="button" aria-pressed="false">Music: off</button>
            <button id="scare-toggle" class="btn btn--small" type="button" aria-pressed="true">Scares: on</button>
            <button id="haptics-toggle" class="btn btn--small" type="button" aria-pressed="true">Buzz: on</button>
          </div>
          <button id="trophies-button" class="btn btn--small btn--trophy" type="button">Trophies</button>
        </div>
        <p id="menu-stats" class="menu-stats"></p>
        <p class="tagline">look behind you</p>
      </section>

      <!-- Game -->
      <section id="game-screen" class="game" aria-label="Solitaire table" hidden>
        <header class="hud">
          <div class="hud-panel hud-panel--score">
            <span class="hud-label">Souls</span>
            <strong id="hud-score" class="hud-value hud-value--big">0</strong>
          </div>
          <div class="hud-panel">
            <span class="hud-label">Moves</span>
            <strong id="hud-moves" class="hud-value">0</strong>
          </div>
          <div class="hud-panel">
            <span class="hud-label">Time</span>
            <strong id="hud-time" class="hud-value">0:00</strong>
          </div>
          <div class="hud-actions">
            <button id="undo-button" class="btn btn--blood" type="button" title="Undo (Z)">Undo</button>
            <button id="hint-button" class="btn btn--pumpkin" type="button" title="Hint (H)">Hint</button>
            <button id="new-button" class="btn" type="button" title="New game (N)">New</button>
            <button id="rules-button" class="btn" type="button" title="How to play (?)" aria-label="How to play">?</button>
            <button id="menu-button" class="btn" type="button" title="Menu (Esc)">Menu</button>
          </div>
        </header>
        <div id="board" class="board" aria-label="Cards"></div>
      </section>

      <!-- Lobbies: Hold'em with friends -->
      <section id="lobby-screen" class="menu lobby" aria-label="Play with friends" hidden>
        <h2 class="lobby-title">The Haunted Table</h2>
        <p class="lobby-sub">Hold'em with friends. Bots fill the empty chairs.</p>
        <label class="field">
          <span>Your name</span>
          <input id="lobby-name" type="text" maxlength="14" autocomplete="nickname" placeholder="Lost Soul">
        </label>
        <div id="lobby-start" class="lobby-panel">
          <button id="lobby-create" class="btn btn--big btn--blood" type="button">Create lobby</button>
          <p class="lobby-or">or join one</p>
          <div class="lobby-join">
            <input id="lobby-code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Lobby code">
            <button id="lobby-join" class="btn btn--big btn--ecto" type="button">Join</button>
          </div>
        </div>
        <div id="lobby-room" class="lobby-panel" hidden>
          <p class="lobby-code-label">lobby code</p>
          <p id="lobby-code-show" class="lobby-code"></p>
          <button id="lobby-invite" class="btn btn--pumpkin" type="button">Share invite link</button>
          <ul id="lobby-players" class="lobby-players"></ul>
          <div id="lobby-host-options" class="menu-options">
            <button id="lobby-bots" class="btn btn--small" type="button">Bots: 1</button>
            <button id="lobby-difficulty" class="btn btn--small" type="button">Level: Normal</button>
          </div>
          <button id="lobby-go" class="btn btn--big btn--blood" type="button">Deal them in</button>
        </div>
        <p id="lobby-status" class="lobby-status" aria-live="polite"></p>
        <button id="lobby-back" class="btn" type="button">Back</button>
      </section>

      <!-- Poker and Blackjack -->
      <section id="table-screen" class="game table-screen" aria-label="Card table" hidden>
        <header class="hud">
          <div class="hud-panel hud-panel--score">
            <span id="table-label-0" class="hud-label">Souls</span>
            <strong id="table-value-0" class="hud-value hud-value--big">0</strong>
          </div>
          <div class="hud-panel">
            <span id="table-label-1" class="hud-label"></span>
            <strong id="table-value-1" class="hud-value"></strong>
          </div>
          <div class="hud-panel">
            <span id="table-label-2" class="hud-label"></span>
            <strong id="table-value-2" class="hud-value"></strong>
          </div>
          <div class="hud-actions">
            <button id="table-rules-button" class="btn" type="button" title="How to play (?)" aria-label="How to play">?</button>
            <button id="table-menu-button" class="btn" type="button" title="Menu (Esc)">Menu</button>
          </div>
        </header>
        <div id="felt" class="felt" aria-label="Table"></div>
        <div id="table-actions" class="table-actions"></div>
      </section>

      <p id="whisper" class="whisper" aria-live="polite"></p>
    </div>

    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <div id="popups" class="popups" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true"></div>
    <div id="dim" class="dim" aria-hidden="true"></div>

    <div id="win" class="win" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
      <div class="win-card">
        <p id="win-eyebrow" class="win-eyebrow">every soul laid to rest</p>
        <h2 id="win-title" class="win-title">You Escaped</h2>
        <dl id="win-stats" class="win-stats"></dl>
        <div class="win-buttons">
          <button id="win-again" class="btn btn--big btn--blood" type="button">Deal again</button>
          <button id="win-menu" class="btn" type="button">Menu</button>
        </div>
      </div>
    </div>

    <div id="rules" class="win" role="dialog" aria-modal="true" aria-labelledby="rules-title" hidden>
      <div class="win-card rules-card">
        <p class="win-eyebrow">how to play</p>
        <h2 id="rules-title" class="win-title"></h2>
        <ul id="rules-list" class="rules-list"></ul>
        <div class="win-buttons">
          <button id="rules-close" class="btn btn--big btn--blood" type="button">Got it</button>
        </div>
      </div>
    </div>

    <div id="trophy-room" class="win" role="dialog" aria-modal="true" aria-labelledby="trophy-title" hidden>
      <div class="win-card trophy-card">
        <p class="win-eyebrow">pick a card back</p>
        <h2 id="trophy-title" class="win-title">Trophies</h2>
        <div id="trophy-body" class="trophy-body"></div>
        <div class="win-buttons">
          <button id="trophy-close" class="btn btn--big btn--blood" type="button">Back</button>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <audio id="music" src="./audio/boba-bash-game.mp3" preload="none" loop></audio>
  </body>
</html>
